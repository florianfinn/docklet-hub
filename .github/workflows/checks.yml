name: PR checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    env:
      PUBLICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # Text-only PRs skip install, lint, build and the full suite.
      - id: scope
        run: echo "scope=$(node scripts/change-scope.mjs --ci)" >> "$GITHUB_OUTPUT"
      - run: node scripts/show-check-evidence.mjs
      - run: node scripts/check-publication.mjs --history
      - run: node scripts/check-pr-publication.mjs
      - if: steps.scope.outputs.scope == 'text'
        run: node scripts/change-scope.mjs --run-text-tests
      - if: steps.scope.outputs.scope != 'text'
        run: npm install --global pnpm@11.21.0
      - if: steps.scope.outputs.scope != 'text'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.scope != 'text'
        run: git config core.hooksPath .githooks
      - if: steps.scope.outputs.scope != 'text'
        run: pnpm run lint
      - if: steps.scope.outputs.scope != 'text'
        run: pnpm run test
      - if: steps.scope.outputs.scope != 'text'
        run: pnpm run build
