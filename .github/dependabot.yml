# Dependency update PRs require local checks, GitHub checks and review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns: ["*"]
    # @types/node follows the Node series in .nvmrc and the Dockerfiles.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
  # Moves the base digests within the pinned Node series; a series change is
  # a deliberate change together with .nvmrc and @types/node.
  - package-ecosystem: docker
    directories: ["/server", "/agent"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      node-base:
        patterns: ["node"]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
